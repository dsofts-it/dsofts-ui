    <path d="M 15 14 L 26 14 C 32.5 14 36 17.5 36 24 C 36 30.5 32.5 34 L 15 34 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 22 19 L 28 24 L 22 29" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <text x="66" y="34" font-family="'Outfit', 'Inter', sans-serif" font-size="26" font-weight="800" fill="#0f172a" letter-spacing="-0.5">DSofts</text>
  <circle cx="162" cy="31" r="3.5" fill="#0284c7" />
  <text x="67" y="47" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="2.5">IT SERVICES</text>
